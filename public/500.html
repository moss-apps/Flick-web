<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Something went wrong — Flick</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #101010;
        color: #e5e5e5;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 36rem;
        padding: 2.5rem 1.5rem;
        text-align: center;
      }
      .code {
        color: #737373;
        font-size: 0.8125rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        margin: 0 0 0.75rem;
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 0.75rem;
        letter-spacing: -0.02em;
      }
      p {
        color: #a3a3a3;
        margin: 0 0 1rem;
      }
      .details {
        color: #525252;
        font-size: 0.8125rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        margin-bottom: 2rem;
        word-break: break-all;
      }
      nav {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      a {
        color: #fff;
        text-decoration: none;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 0.75rem;
        padding: 0.75rem 1.5rem;
        font-weight: 600;
        font-size: 0.9375rem;
      }
      a:hover {
        background: rgba(255, 255, 255, 0.06);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 500</p>
      <h1>The server hit a wrong note.</h1>
      <p>Something failed on our side, not yours. Please try again in a moment.</p>
      <p class="details">
        Request: ::vercel:REQUEST_ID::<br />
        Code: ::vercel:ERROR_CODE::
      </p>
      <nav>
        <a href="https://flick-player.site/">Back to Flick</a>
        <a href="https://github.com/moss-apps/Flick/issues">Report a problem</a>
      </nav>
    </main>
  </body>
</html>
